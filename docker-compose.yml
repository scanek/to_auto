version: '3.8'

services:
  autotracker:
    image: ghcr.io/scanek/to_auto:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autotracker
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "9900:8000"
    environment:
      - DATA_DIR=/app/data
      - UPLOAD_DIR=/app/data/uploads
      - DATABASE_URL=sqlite+aiosqlite:////app/data/autotracker.db
    volumes:
      - autotracker_data:/app/data

  # Automatic updater: checks GitHub Container Registry and restarts container when a new image is pushed
  watchtower:
    image: containrrr/watchtower:latest
    container_name: autotracker-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOCKER_API_VERSION=1.44      # Fixes "client version 1.25 is too old. Minimum supported API version is 1.40"
      - WATCHTOWER_POLL_INTERVAL=300 # Check for new image every 5 minutes (300 sec)
      - WATCHTOWER_CLEANUP=true      # Automatically delete old images to save disk space
      - WATCHTOWER_INCLUDE_RESTARTING=true
    command: autotracker

volumes:
  autotracker_data:
    driver: local

<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>Бортовой Журнал</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // string into just a query string, and then redirects the browser
      // to the new url with only a query string and hash fragment,
      // e.g. https://www.foo.tld/one/two?a=b&c=d#qwe becomes
      // https://www.foo.tld/?/one/two&a=b~and~c=d#qwe
      // Note: this 404.html file must be at least 512 bytes for some browsers.

      var pathSegmentsToKeep = 1;

      var l = window.location;
      var isLocalOrApex = l.hostname === 'localhost' || l.hostname === '127.0.0.1' || !l.hostname.includes('github.io');
      if (isLocalOrApex) {
        pathSegmentsToKeep = 0;
      }

      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <!-- Fallback for browsers that don't execute JS or while redirecting -->
    <div style="font-family: sans-serif; text-align: center; padding: 50px;">
      <h2>Загрузка Бортового Журнала...</h2>
      <p>Перенаправление на страницу сервисной книжки...</p>
    </div>
  </body>
</html>
